name: secret-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: gitleaks only needs to read the checkout. The check gates on
# the scan's exit code, so no write scopes are required.
permissions:
  contents: read

jobs:
  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can diff the whole PR / pushed range.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for organization-owned repos;
          # ksdisch/home-base is a personal-account repo, so none is needed.
